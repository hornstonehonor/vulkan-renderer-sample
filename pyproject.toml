[build-system]
requires = ["setuptools>=69", "wheel", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "vulkan-renderer-sample"
version = "0.6.3"
description = "A pipeline/worker Vulkan renderer sample: ingest handlers, render-pass processors, output drivers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "vulkan-renderer-sample contributors" }]
keywords = ["vulkan", "renderer", "graphics", "spirv", "sample"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Topic :: Multimedia :: Graphics :: 3D Rendering",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: C++",
  "Programming Language :: C#",
  "Programming Language :: Java",
]

dependencies = [
  "numpy>=1.26",
  "pydantic>=2.6",
  "structlog>=24.1",
]

[project.optional-dependencies]
vulkan = ["vulkan>=1.3.2 ; platform_system=='Linux'"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "mypy>=1.10",
  "rich>=13.7",
]

[project.scripts]
vulkan-renderer-sample = "vulkan_renderer_sample.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["vulkan_renderer_sample"]

[tool.pytest.ini_options]
markers = [
  "gpu: requires a real Vulkan device",
  "validation: requires VK_LAYER_KHRONOS_validation",
]